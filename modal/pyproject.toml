[project]
name = "tabpaste-modal"
version = "0.1.0"
description = "YouTube fingerstyle guitar to tab converter - Modal backend"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.70.0",
    "basic-pitch>=0.6.0",
    "yt-dlp>=2024.0.0",
    "supabase>=2.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
